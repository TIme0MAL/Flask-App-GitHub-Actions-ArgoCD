name: Security Pipeline

on:
  workflow_dispatch:

jobs:
  scan-container:
    runs-on: ubuntu-latest
    steps:
      - name: Run Container Scan
        run: echo "Container Scan running..."

  license-check:
    runs-on: ubuntu-latest
    needs: scan-container
    steps:
      - name: Run License Check
        run: echo "License Check running..."

  static-analysis:
    runs-on: ubuntu-latest
    needs: license-check
    steps:
      - name: Run Static Analysis
        run: echo "Static Analysis running..."

  dast:
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Run DAST
        run: echo "DAST running..."



      


        
      

